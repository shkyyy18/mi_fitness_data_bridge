[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mi-fitness-data-bridge"
version = "0.3.1"
description = "Local-first bridge for Mi Fitness health data, portable exports, and MCP"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.11"
authors = [
    {name = "Aleksej Kubulashvili", email = "kubulashvili@users.noreply.github.com"},
]
maintainers = [
    {name = "shkyyy18"},
]
keywords = ["mcp", "model-context-protocol", "mi-fitness", "xiaomi", "fitness", "health"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0,<2.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "platformdirs>=4.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
mi-fitness-bridge = "mi_fitness_mcp.cli_mi_fitness:main"
mi-fitness-mcp = "mi_fitness_mcp.cli_mi_fitness:main"

[project.urls]
Homepage = "https://github.com/shkyyy18/mi_fitness_data_bridge"
Repository = "https://github.com/shkyyy18/mi_fitness_data_bridge"
Issues = "https://github.com/shkyyy18/mi_fitness_data_bridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mi_fitness_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
